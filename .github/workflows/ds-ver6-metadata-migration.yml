name: DS ver.6 metadata migration

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/migrate_ds_ver6_metadata.py"
      - ".github/workflows/ds-ver6-metadata-migration.yml"

permissions:
  contents: write

jobs:
  migrate-statistics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrate statistics metadata
        run: python scripts/migrate_ds_ver6_metadata.py --tag statistics --write

      - name: Lint DS front matter
        run: python scripts/lint_ds_frontmatter.py

      - name: Commit migrated metadata
        shell: bash
        run: |
          if git diff --quiet -- pages/ds; then
            echo "No metadata changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/ds
          git commit -m "Migrate DS statistics metadata to ver.6"
          git push
