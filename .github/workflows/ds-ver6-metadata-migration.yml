name: DS ver.6 metadata migration

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/migrate_ds_ver6_metadata.py"
      - ".github/workflows/ds-ver6-metadata-migration.yml"

permissions:
  contents: write

jobs:
  migrate-safe-datascience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrate safe data science metadata
        shell: bash
        run: |
          for tag in linear-algebra calculus set-theory statistics data-preparation visualization modeling unstructured-data; do
            python scripts/migrate_ds_ver6_metadata.py --tag "$tag" --write
          done

      - name: Validate migration diff
        shell: bash
        run: |
          git diff --check -- pages/ds
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed_sections = {
              "linear-algebra", "calculus", "set-theory", "statistics",
              "data-preparation", "visualization", "modeling", "unstructured-data",
          }

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--", "pages/ds"], text=True
          ).splitlines()
          if not changed:
              print("No DS article changes to validate.")
              raise SystemExit(0)

          errors = []
          for name in changed:
              path = Path(name)
              text = path.read_text(encoding="utf-8-sig")
              lines = text.splitlines()
              if not lines or lines[0].strip() != "---":
                  errors.append(f"{name}: invalid front matter start")
                  continue
              try:
                  end = next(i for i, line in enumerate(lines[1:], start=1) if line.strip() == "---")
              except StopIteration:
                  errors.append(f"{name}: missing front matter end")
                  continue

              fm = lines[1:end]
              area = [line for line in fm if line.startswith("ds_area:")]
              section = [line for line in fm if line.startswith("ds_section:")]
              if len(area) != 1 or len(section) != 1:
                  errors.append(f"{name}: ds_area/ds_section must each appear exactly once")
                  continue

              if area != ["ds_area: datascience"]:
                  errors.append(f"{name}: expected datascience area")

              section_value = section[0].split(":", 1)[1].strip()
              if section_value not in allowed_sections:
                  errors.append(f"{name}: unexpected datascience section {section_value!r}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print(f"Validated {len(changed)} changed DS article(s).")
          PY

      - name: Commit migrated metadata
        shell: bash
        run: |
          if git diff --quiet -- pages/ds; then
            echo "No metadata changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/ds
          git commit -m "Migrate safe DS data science metadata to ver.6"
          git push
