name: FE duplicate content candidate audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_fe_duplicate_content.py'
      - 'tests/test_fe_duplicate_content.py'
      - '.github/workflows/fe-duplicate-content-audit.yml'
      - 'pages/fe/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test FE duplicate audit
        run: python -m unittest discover -s tests -p 'test_fe_duplicate_content.py' -v
      - name: Scan all FE Markdown files
        run: python scripts/audit_fe_duplicate_content.py --output docs/audits/fe-duplicate-candidates.md
      - name: Scan expanded candidates for follow-up review
        run: python scripts/audit_fe_duplicate_content.py --min-overlap 0.15 --top 200 --output docs/audits/fe-duplicate-candidates-expanded.md
      - name: Upload review-only report
        uses: actions/upload-artifact@v4
        with:
          name: fe-duplicate-candidates
          path: docs/audits/fe-duplicate-candidates*.md
          retention-days: 30
