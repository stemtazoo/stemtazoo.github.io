name: DS ver.6 official change-map migration

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/migrate_ds_ver6_official_change_mapping.py'
      - '.github/workflows/ds-ver6-official-change-map-migration.yml'

permissions:
  contents: write

concurrency:
  group: ds-ver6-official-change-map
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dry run official change map
        run: python scripts/migrate_ds_ver6_official_change_mapping.py
      - name: Apply official change map
        run: python scripts/migrate_ds_ver6_official_change_mapping.py --write
      - name: Validate changed articles
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          changed = []
          for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines():
              p = line[3:]
              if p.startswith('pages/ds/') and p.endswith('.md'):
                  changed.append(Path(p))
          for path in changed:
              text = path.read_text(encoding='utf-8')
              assert '## 対応スキル項目（ver.6 ' in text, path
              assert 'データサイエンス力シート' not in text, path
              assert 'データエンジニアリング力シート' not in text, path
          print(f'Validated {len(changed)} changed articles.')
          PY
      - name: Refresh DS audits
        run: |
          python scripts/audit_ds_ver5_body_labels.py
          python scripts/audit_ds_ver6_similar_skill_candidates.py
      - name: Commit with concurrent-update retry
        run: |
          if [ -z "$(git status --porcelain pages/ds docs/audits/ds-ver5-body-labels.md docs/audits/ds-ver6-similar-skill-candidates.md)" ]; then
            echo "No official change-map changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/ds/*.md docs/audits/ds-ver5-body-labels.md docs/audits/ds-ver6-similar-skill-candidates.md
          git commit -m "Migrate DS skills with official ver.6 change maps"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Failed to push after 3 attempts."
          exit 1
