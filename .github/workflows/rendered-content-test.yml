name: Rendered content audit tests

on:
  pull_request:
    paths:
      - 'scripts/audit_rendered_content.py'
      - 'tests/test_rendered_content.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/rendered-content-test.yml'
  push:
    paths:
      - 'scripts/audit_rendered_content.py'
      - 'tests/test_rendered_content.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/rendered-content-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_rendered_content.py' -v
      - name: Build preview with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Audit preview article text
        run: python scripts/audit_rendered_content.py
      - name: Upload preview audit
        uses: actions/upload-artifact@v4
        with:
          name: rendered-content-preview-audit
          path: artifacts/rendered-content-audit.json
