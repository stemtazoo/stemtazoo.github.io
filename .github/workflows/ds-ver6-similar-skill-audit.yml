name: DS ver.6 similar skill audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'pages/ds/*.md'
      - 'scripts/audit_ds_ver6_similar_skill_candidates.py'
      - '.github/workflows/ds-ver6-similar-skill-audit.yml'

permissions:
  contents: write

concurrency:
  group: ds-ver6-similar-skill-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate similar-skill audit
        run: python scripts/audit_ds_ver6_similar_skill_candidates.py
      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain docs/audits/ds-ver6-similar-skill-candidates.md)" ]; then
            echo "Similar-skill audit unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/ds-ver6-similar-skill-candidates.md
          git commit -m "Update DS ver.6 similar skill audit"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Audit report pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after refreshing main."
            git rebase --abort || true
            sleep $((attempt * 2))
          done

          echo "Failed to push audit report after 3 attempts."
          exit 1
