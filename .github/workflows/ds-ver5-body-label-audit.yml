name: DS ver.5 body label audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'pages/ds/*.md'
      - 'scripts/audit_ds_ver5_body_labels.py'
      - '.github/workflows/ds-ver5-body-label-audit.yml'

permissions:
  contents: write

concurrency:
  group: ds-ver5-body-label-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate audit
        run: python scripts/audit_ds_ver5_body_labels.py
      - name: Commit audit report
        run: |
          if [ -n "$(git status --porcelain docs/audits/ds-ver5-body-labels.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/audits/ds-ver5-body-labels.md
            git commit -m "Update DS ver.5 body label audit"

            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "Audit report pushed successfully."
                  exit 0
                fi
              else
                git rebase --abort || true
              fi

              echo "Push attempt ${attempt} failed; retrying after refresh."
              sleep $((attempt * 2))
            done

            echo "Failed to push audit report after 3 attempts."
            exit 1
          else
            echo "Audit report unchanged."
          fi
