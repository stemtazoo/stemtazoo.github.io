name: DS ver.6 reviewed article migration

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/migrate_ds_ver6_reviewed_business.py"
      - "scripts/migrate_ds_ver6_reviewed_followup.py"
      - ".github/workflows/ds-ver6-reviewed-business.yml"

permissions:
  contents: write

jobs:
  migrate-reviewed-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrate reviewed DS articles
        run: |
          python scripts/migrate_ds_ver6_reviewed_business.py
          python scripts/migrate_ds_ver6_reviewed_followup.py

      - name: Validate changes
        run: |
          git diff --check -- pages/ds
          python - <<'PY'
          from pathlib import Path
          from scripts.migrate_ds_ver6_reviewed_business import EXPECTED as BASE_EXPECTED
          from scripts.migrate_ds_ver6_reviewed_followup import EXPECTED as FOLLOWUP_EXPECTED

          expected = {**BASE_EXPECTED, **FOLLOWUP_EXPECTED}
          for name, (area, section) in expected.items():
              text = (Path("pages/ds") / name).read_text(encoding="utf-8-sig")
              assert text.count(f"ds_area: {area}") == 1, name
              assert text.count(f"ds_section: {section}") == 1, name
          print(f"Validated {len(expected)} reviewed articles.")
          PY

      - name: Commit reviewed metadata
        run: |
          if git diff --quiet -- pages/ds; then
            echo "No reviewed metadata changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/ds
          git commit -m "Migrate reviewed DS metadata to ver.6"
          git push
