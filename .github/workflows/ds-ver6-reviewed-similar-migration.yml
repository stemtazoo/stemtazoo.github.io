name: DS ver.6 reviewed similar migration

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/migrate_ds_ver6_reviewed_similar_items.py'
      - '.github/workflows/ds-ver6-reviewed-similar-migration.yml'

permissions:
  contents: write

concurrency:
  group: ds-ver6-reviewed-similar-migration-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dry run reviewed near matches
        run: python scripts/migrate_ds_ver6_reviewed_similar_items.py
      - name: Apply reviewed near matches
        run: python scripts/migrate_ds_ver6_reviewed_similar_items.py --write
      - name: Refresh DS ver.5 and similarity audits
        run: |
          python scripts/audit_ds_ver5_body_labels.py
          python scripts/audit_ds_ver6_similar_skill_candidates.py
      - name: Validate changed articles
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from scripts.migrate_ds_ver6_reviewed_similar_items import REVIEWED

          changed = []
          for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines():
              path = line[3:]
              if path.startswith('pages/ds/') and path.endswith('.md'):
                  changed.append(Path(path))

          legacy = ('ビジネス力シート','AI利活用スキルシート','データサイエンス力シート','データエンジニアリング力シート')
          for path in changed:
              assert path.name in REVIEWED, path
              text = path.read_text(encoding='utf-8')
              assert '## 対応スキル項目（ver.6 ' in text, path
              assert not any(label in text for label in legacy), path
          print(f'Validated {len(changed)} reviewed near-match articles.')
          PY
      - name: Commit with concurrent-update retry
        run: |
          if [ -z "$(git status --porcelain pages/ds docs/audits/ds-ver5-body-labels.md docs/audits/ds-ver6-similar-skill-candidates.md)" ]; then
            echo "No reviewed migration or audit changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/ds/*.md docs/audits/ds-ver5-body-labels.md docs/audits/ds-ver6-similar-skill-candidates.md
          git commit -m "Migrate reviewed DS skill mappings to ver.6"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done
          echo "Failed to push after 3 attempts."
          exit 1
