name: Normalize SG primary tags

on:
  push:
    paths:
      - "scripts/resolve_sg_primary_tags.py"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply reviewed primary-tag overrides
        run: python scripts/resolve_sg_primary_tags.py --apply

      - name: Run audit
        run: python scripts/audit_sg_primary_tags.py

      - name: Check diff
        run: git diff --check

      - name: Commit normalized tags
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No reviewed tag changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/sg
          git commit -m "Resolve reviewed SG primary tags"
          git push
