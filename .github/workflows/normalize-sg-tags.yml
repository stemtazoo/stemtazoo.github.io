name: Normalize SG primary tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show planned safe changes
        run: python scripts/normalize_sg_primary_tags.py

      - name: Apply safe changes
        run: python scripts/normalize_sg_primary_tags.py --apply

      - name: Check diff
        run: git diff --check

      - name: Commit normalized tags
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No safe tag changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/sg
          git commit -m "Normalize unambiguous SG primary tags"
          git push
